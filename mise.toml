[tools]
go = "1.26.3"
rust = "1.98.0"

[tasks."rust:check"]
description = "检查 Rust workspace；缓存仅写入 ../build"
run = "sh -c 'SWITCH_SOURCE_ROOT=$PWD; . scripts/workspace-env.sh; cd rust; cargo fmt --all -- --check && cargo test --workspace && cargo clippy --workspace --all-targets -- -D warnings'"

[tasks.build]
description = "构建 OneWIFI.app 到 ../dist（不生成 DMG）"
run = "scripts/build.sh"

[tasks.launch]
description = "启动 OneWIFI，运行数据保存在 ../build/runtime"
run = "scripts/launch.sh"

[tasks.quit]
description = "正常退出 OneWIFI 及其自有后端"
run = "scripts/quit.sh"

[tasks.clean]
description = "仅列出可清理缓存；--remove 精确路径才删除"
run = "scripts/clean-generated.sh"

[tasks."test:gates"]
description = "运行 Rust/Go 统一门禁"
run = "scripts/test-migration-gates.sh"
